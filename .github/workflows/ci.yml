name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Every supported Python on Linux, plus the oldest and newest on
        # Windows and macOS. Windows matters specifically: its console
        # defaults to a legacy codepage rather than UTF-8, and its process
        # start method re-imports the calling module, both of which have
        # produced bugs a Linux-only matrix could not see.
        os: [ubuntu-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.9"
          - os: windows-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.13"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dev dependencies
        run: pip install -e ".[dev,plot]"

      - name: Run tests
        run: pytest --tb=short
